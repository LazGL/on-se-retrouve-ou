<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On se retrouve où</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=41">
</head>
<body>
<main>
  <h1>On se retrouve où ?</h1>

  <div class="card">
    <div id="people"></div>
    <div class="row">
      <button id="add" type="button">+ Ajouter une personne</button>
      <button id="share" type="button" title="Copie un lien qui préremplit cette recherche">🔗 Copier le lien</button>
      <select id="recent" aria-label="Reprendre une recherche récente" title="Reprendre une recherche récente" hidden></select>
    </div>
    <div class="row">
      <select id="kind" aria-label="Type de lieu">
        <option value="resto">🍽️ Resto</option>
        <option value="bar">🍺 Bar</option>
        <option value="cafe">☕ Café</option>
        <option value="park">🌳 Parc</option>
        <option value="station">🚉 Station (juste se retrouver)</option>
      </select>
      <label for="when">arrivée</label>
      <input id="when" type="datetime-local">
      <button id="go" type="button">Trouver</button>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="refining" class="alt" hidden></div>
  <div id="weather" hidden></div>
  <div id="filters" hidden>
    <div id="chips"></div>
    <label><input type="checkbox" id="f-open" checked> Ouvert seulement</label>
    <label><input type="checkbox" id="f-terrace"> Terrasse</label>
    <label><input type="checkbox" id="f-veggie"> Végétarien</label>
    <label title="Accès en fauteuil roulant renseigné dans OpenStreetMap"><input type="checkbox" id="f-wheelchair"> ♿ Accessible</label>
  </div>
  <div id="map"></div>
  <div id="route" class="card"></div>
  <div id="results"></div>
  <footer>Lieux et cartes © OpenStreetMap · trajets Transitous (secours OSRM) · adresses Nominatim et Photon · stations Vélib' open data Ville de Paris · météo Open-Meteo · horaires opening_hours.js<br><a href="https://github.com/LazGL/on-se-retrouve-ou">Code source et contact</a></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opening_hours@3.15.0/build/opening_hours.min.js"></script>
<script src="js/config.js?v=41"></script>
<script src="js/geo.js?v=41"></script>
<script src="js/ranking.js?v=41"></script>
<script src="js/share.js?v=41"></script>
<script src="js/hours.js?v=41"></script>
<script src="js/weather.js?v=41"></script>
<script src="js/api.js?v=41"></script>
<script src="js/map.js?v=41"></script>
<script src="js/ui.js?v=41"></script>
<script src="js/app.js?v=41"></script>
</body>
</html>
